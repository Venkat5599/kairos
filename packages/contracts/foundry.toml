[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
polkadot_hub = "${POLKADOT_HUB_RPC_URL}"
moonbase = "https://rpc.api.moonbase.moonbeam.network"
moonbase_alt = "https://moonbeam-alpha.api.onfinality.io/public"

[etherscan]
polkadot_hub = { key = "${ETHERSCAN_API_KEY}" }
moonbase = { key = "moonbase", url = "https://api-moonbase.moonscan.io/api" }
